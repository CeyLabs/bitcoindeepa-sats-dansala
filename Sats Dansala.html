<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Sats Dansala · Bitcoin Deepa</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;500;600;700;800;900&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root{
    --orange:#F7931A;
    --orange-deep:#F57600;
    --gold:#FFC76A;
    --ember:#FF6B2C;
    --ink:#0B0A0C;
    --ink-2:#141117;
    --panel:#17141B;
    --panel-2:#1F1A24;
    --line:rgba(255,255,255,0.10);
    --line-2:rgba(255,255,255,0.06);
    --text:#F4EEE7;
    --muted:#A79CA6;
    --muted-2:#766E78;
    --mono:"IBM Plex Mono", ui-monospace, monospace;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{scroll-behavior:smooth;}
  body{
    font-family:"Exo 2", system-ui, sans-serif;
    background:var(--ink);
    color:var(--text);
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
    overflow-x:hidden;
  }
  /* layered warm night background */
  body::before{
    content:""; position:fixed; inset:0; z-index:-2;
    background:
      radial-gradient(1100px 720px at 78% -6%, rgba(255,138,31,0.20), transparent 60%),
      radial-gradient(900px 700px at 8% 110%, rgba(255,107,44,0.14), transparent 60%),
      linear-gradient(180deg, #100C12 0%, #0B0A0C 55%, #0E0A10 100%);
  }
  body[data-bg="ember"]::before{
    background:
      radial-gradient(1200px 900px at 50% 120%, rgba(255,107,44,0.30), transparent 62%),
      radial-gradient(800px 600px at 80% 0%, rgba(255,138,31,0.16), transparent 60%),
      linear-gradient(180deg, #160C0A 0%, #0C0807 60%, #140A0A 100%);
  }
  body[data-bg="plain"]::before{
    background:linear-gradient(180deg, #121016 0%, #0B0A0C 100%);
  }
  body::after{
    content:""; position:fixed; inset:0; z-index:-1; pointer-events:none;
    background-image:radial-gradient(rgba(255,255,255,0.04) 1px, transparent 1px);
    background-size:3px 3px; mix-blend-mode:screen; opacity:.5;
  }
  .page{ position:relative; max-width:1240px; margin:0 auto; padding:0 32px; }

  /* ── ambient lanterns ───────────────────────────────── */
  .ambient{ position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden; }
  .amb{ position:absolute; opacity:.9; }
  .a1{ top:-30px; right:6%; animation:sway 7s ease-in-out infinite; }
  .a2{ top:120px; left:3%; animation:sway 9s ease-in-out infinite .6s; }
  .a3{ top:46%; right:-1%; opacity:.5; animation:sway 8s ease-in-out infinite 1.2s; }
  .a4{ top:70%; left:-3%; opacity:.4; animation:sway 10s ease-in-out infinite .3s; }
  .a5{ top:24%; left:47%; opacity:.22; animation:sway 11s ease-in-out infinite 1.8s; }
  @keyframes sway{ 0%,100%{ transform:translateY(0) rotate(-2deg);} 50%{ transform:translateY(16px) rotate(2deg);} }

  /* ── Vesak lantern ──────────────────────────────────── */
  .lantern{ position:relative; display:flex; flex-direction:column; align-items:center; }
  .lan-string{ width:1px; height:26px; background:linear-gradient(var(--line),transparent); }
  .lan-star{ position:relative; }
  .tri{ position:absolute; inset:0; }
  .tri.up{ clip-path:polygon(50% 2%, 2% 96%, 98% 96%); }
  .tri.down{ clip-path:polygon(50% 98%, 2% 4%, 98% 4%); }
  .hue-warm .tri{ background:linear-gradient(160deg, rgba(255,170,70,.42), rgba(255,107,44,.30)); box-shadow:inset 0 0 24px rgba(255,200,120,.5); }
  .hue-ember .tri{ background:linear-gradient(160deg, rgba(255,90,30,.40), rgba(200,40,10,.30)); box-shadow:inset 0 0 24px rgba(255,120,60,.5); }
  .hue-gold .tri{ background:linear-gradient(160deg, rgba(255,210,110,.42), rgba(255,160,40,.30)); box-shadow:inset 0 0 24px rgba(255,225,150,.55); }
  .lan-star{ filter:drop-shadow(0 0 26px rgba(255,140,40,.45)); }
  .lan-core{ position:absolute; left:50%; top:52%; width:30%; height:30%; transform:translate(-50%,-50%);
    border-radius:50%; background:radial-gradient(circle, #FFE7BE 0%, rgba(255,170,70,.55) 50%, transparent 72%);
    animation:flick 2.4s ease-in-out infinite; }
  @keyframes flick{ 0%,100%{ opacity:.85; transform:translate(-50%,-50%) scale(1);} 50%{ opacity:1; transform:translate(-50%,-50%) scale(1.12);} }
  .lan-tassels{ display:flex; gap:7px; margin-top:-4px; }
  .tassel{ width:2px; height:22px; border-radius:2px; background:linear-gradient(var(--orange), transparent); transform-origin:top center; animation:tsway 3s ease-in-out infinite; }
  @keyframes tsway{ 0%,100%{ transform:rotate(-6deg);} 50%{ transform:rotate(6deg);} }

  /* ── oil-lamp flame ─────────────────────────────────── */
  .flame{ position:relative; display:inline-block; flex:0 0 auto; }
  .flame-body{ position:absolute; left:50%; bottom:0; width:62%; height:88%; transform:translateX(-50%);
    background:linear-gradient(180deg,#FFD98A 0%, var(--orange) 45%, var(--ember) 100%);
    border-radius:50% 50% 50% 50% / 64% 64% 40% 40%;
    clip-path:polygon(50% 0%, 78% 42%, 84% 74%, 50% 100%, 16% 74%, 22% 42%);
    filter:drop-shadow(0 0 14px rgba(255,140,40,.7)); animation:flame 1.6s ease-in-out infinite; transform-origin:bottom center; }
  .flame-core{ position:absolute; left:50%; bottom:6%; width:30%; height:46%; transform:translateX(-50%);
    background:linear-gradient(180deg,#FFFDF5,#FFE39E); border-radius:50% 50% 50% 50% / 60% 60% 44% 44%; opacity:.95; }
  @keyframes flame{ 0%,100%{ transform:translateX(-50%) scaleY(1) skewX(-1deg);} 50%{ transform:translateX(-50%) scaleY(1.08) skewX(2deg);} }

  /* ── nav ────────────────────────────────────────────── */
  .nav{ position:relative; z-index:3; display:flex; align-items:center; justify-content:space-between; padding:26px 0 22px; }
  .deepa-mark{ display:inline-flex; align-items:center; gap:9px; font-weight:800; letter-spacing:-0.01em; line-height:1; }
  .dm-bolt{ display:inline-flex; filter:drop-shadow(0 2px 8px rgba(255,138,31,.4)); }
  .dm-text{ color:var(--text); }
  .nav-right{ display:flex; align-items:center; gap:18px; }
  .nav-event{ font-family:var(--mono); font-size:12.5px; letter-spacing:.04em; color:var(--muted); }
  .nav-link{ display:inline-flex; align-items:center; gap:6px; font-size:13px; font-weight:600; color:var(--text);
    text-decoration:none; padding:8px 13px; border:1px solid var(--line); border-radius:999px; transition:.2s; }
  .nav-link:hover{ border-color:var(--orange); color:var(--orange); }

  /* ── hero ───────────────────────────────────────────── */
  .hero{ position:relative; z-index:2; display:grid; grid-template-columns:1.05fr 0.95fr; gap:54px; align-items:center;
    padding:48px 0 30px; min-height:78vh; }
  .kicker{ display:inline-flex; align-items:center; gap:9px; font-family:var(--mono); font-size:12.5px; letter-spacing:.12em;
    text-transform:uppercase; color:var(--gold); margin-bottom:22px; }
  .kicker-dot{ width:7px; height:7px; border-radius:50%; background:var(--orange); box-shadow:0 0 12px var(--orange); animation:flick 2s ease-in-out infinite; }
  .display{ font-size:clamp(54px, 7.2vw, 96px); font-weight:900; line-height:0.96; letter-spacing:-0.035em;
    background:linear-gradient(180deg, #FFFFFF 0%, #FFE7C8 60%, var(--orange) 130%);
    -webkit-background-clip:text; background-clip:text; color:transparent; text-wrap:balance; }
  .lede{ margin-top:22px; max-width:480px; font-size:19px; line-height:1.5; color:var(--muted); text-wrap:pretty; }
  .hero-points{ list-style:none; margin-top:26px; display:flex; flex-direction:column; gap:13px; }
  .hero-points li{ display:flex; align-items:center; gap:12px; font-size:15.5px; font-weight:500; color:var(--text); }
  .hero-points svg{ color:var(--orange); flex:0 0 auto; }
  .hero-meta{ display:flex; align-items:center; gap:22px; margin-top:34px; padding-top:26px; border-top:1px solid var(--line-2); }
  .hero-meta > div{ display:flex; flex-direction:column; gap:4px; }
  .hm-num{ font-family:var(--mono); font-weight:700; font-size:20px; color:var(--text); }
  .hm-lbl{ font-size:12px; letter-spacing:.04em; text-transform:uppercase; color:var(--muted-2); }
  .hm-div{ width:1px; height:38px; background:var(--line); }

  /* ── claim card ─────────────────────────────────────── */
  .hero-claim{ display:flex; justify-content:center; }
  .claim-card{ position:relative; width:100%; max-width:430px; background:linear-gradient(180deg, var(--panel-2), var(--panel));
    border:1px solid var(--line); border-radius:24px; padding:26px 26px 24px; overflow:hidden;
    box-shadow:0 40px 90px -30px rgba(0,0,0,0.8), inset 0 1px 0 rgba(255,255,255,0.06); }
  .cc-glow{ position:absolute; top:-90px; left:50%; transform:translateX(-50%); width:340px; height:200px;
    background:radial-gradient(ellipse, rgba(255,138,31,.30), transparent 70%); pointer-events:none; }
  .cc-header{ display:flex; align-items:center; gap:14px; position:relative; }
  .cc-title{ font-size:20px; font-weight:800; letter-spacing:-0.01em; }
  .cc-sub{ font-size:13px; color:var(--muted); margin-top:2px; }

  .steps{ display:flex; flex-direction:column; gap:10px; margin-top:22px; }
  .step{ display:flex; align-items:center; gap:14px; padding:14px; border:1px solid var(--line);
    border-radius:14px; background:rgba(255,255,255,0.02); transition:.25s; }
  .step.done{ border-color:rgba(255,138,31,.5); background:rgba(255,138,31,.07); }
  .step.locked{ opacity:.46; }
  .step-badge{ flex:0 0 auto; width:34px; height:34px; border-radius:50%; display:grid; place-items:center;
    font-family:var(--mono); font-weight:700; font-size:15px; color:var(--text);
    background:rgba(255,255,255,0.06); border:1px solid var(--line); }
  .step.done .step-badge{ background:var(--orange); color:#0B0A0C; border-color:var(--orange); }
  .claim-step.ready .step-badge{ background:var(--orange); color:#0B0A0C; border-color:var(--orange); }
  .step-body{ flex:1; min-width:0; }
  .step-title{ font-size:14.5px; font-weight:700; }
  .step-desc{ font-size:12.5px; color:var(--muted); margin-top:2px; line-height:1.3; }
  .step-btn{ flex:0 0 auto; display:inline-flex; align-items:center; gap:7px; font-family:inherit; font-size:12.5px; font-weight:700;
    color:#0B0A0C; background:var(--orange); border:none; border-radius:10px; padding:9px 13px; cursor:pointer; transition:.2s; white-space:nowrap; }
  .step-btn:hover:not(:disabled){ background:#fff; }
  .step-btn:disabled{ cursor:not-allowed; opacity:.6; }
  .step.done .step-btn{ background:transparent; color:var(--orange); border:1px solid rgba(255,138,31,.5); }
  .claim-step{ background:rgba(255,255,255,0.02); }

  /* luma verify step */
  .luma-step{ align-items:flex-start; }
  .luma-step .step-badge{ margin-top:1px; }
  .luma-body{ display:flex; flex-direction:column; gap:9px; }
  .luma-row{ display:flex; gap:8px; margin-top:5px; }
  .luma-input{ flex:1; min-width:0; padding:10px 12px; font-family:inherit; font-size:13.5px; color:var(--text);
    background:rgba(0,0,0,0.28); border:1px solid var(--line); border-radius:10px; outline:none; transition:.2s; }
  .luma-input::placeholder{ color:var(--muted-2); }
  .luma-input:focus{ border-color:var(--orange); }
  .luma-verify{ flex:0 0 auto; font-family:inherit; font-size:13px; font-weight:700; color:#0B0A0C; background:var(--orange);
    border:none; border-radius:10px; padding:0 18px; cursor:pointer; transition:.2s; }
  .luma-verify:hover:not(:disabled){ background:#fff; }
  .luma-verify:disabled{ opacity:.6; cursor:not-allowed; }
  .luma-status{ display:flex; align-items:center; gap:8px; font-size:12.5px; color:var(--gold); font-family:var(--mono); margin-top:2px; }
  .luma-msg{ display:flex; align-items:center; gap:6px; font-size:12.5px; font-weight:600; margin-top:2px; word-break:break-all; }
  .luma-msg.ok{ color:#5fd08a; }
  .luma-msg.ok svg{ flex:0 0 auto; }
  .luma-msg.err{ color:#ff7a5c; }
  .luma-link{ font-size:12px; color:var(--muted); text-decoration:none; cursor:pointer; align-self:flex-start; }
  .luma-link:hover{ color:var(--orange); }
  .luma-open{ align-self:flex-start; margin-top:5px; padding:10px 16px; }
  .spin-ring{ display:inline-block; width:18px; height:18px; border:2.5px solid rgba(255,255,255,0.22);
    border-top-color:var(--orange); border-radius:50%; animation:spin .7s linear infinite; }
  .spin-ring.sm{ width:13px; height:13px; border-width:2px; }
  @keyframes spin{ to{ transform:rotate(360deg);} }

  .cc-input{ width:100%; margin-top:14px; padding:13px 15px; font-family:inherit; font-size:14px; color:var(--text);
    background:rgba(0,0,0,0.25); border:1px solid var(--line); border-radius:12px; outline:none; transition:.2s; }
  .cc-input::placeholder{ color:var(--muted-2); }
  .cc-input:focus{ border-color:var(--orange); }

  .claim-btn{ width:100%; margin-top:12px; display:flex; align-items:center; justify-content:center; gap:10px;
    font-family:inherit; font-size:17px; font-weight:800; letter-spacing:.01em; color:#0B0A0C; cursor:pointer;
    background:linear-gradient(180deg, #FFB45A, var(--orange)); border:none; border-radius:14px; padding:17px;
    box-shadow:0 14px 30px -10px rgba(255,138,31,.7); transition:.2s; position:relative; overflow:hidden; }
  .claim-btn:hover:not(:disabled){ transform:translateY(-2px); box-shadow:0 18px 36px -10px rgba(255,138,31,.8); }
  .claim-btn:disabled{ background:rgba(255,255,255,0.07); color:var(--muted-2); box-shadow:none; cursor:not-allowed; }
  .claim-btn.rolling{ flex-direction:column; gap:2px; pointer-events:none; }
  .cb-num{ font-family:var(--mono); font-size:24px; font-weight:700; }
  .cb-spin{ font-size:11px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; opacity:.8; }

  .cc-fineprint{ display:flex; align-items:flex-start; gap:8px; margin-top:14px; font-size:12px; line-height:1.4; color:var(--muted); }
  .cc-fineprint svg{ color:var(--gold); flex:0 0 auto; margin-top:1px; }

  /* ── receipt ────────────────────────────────────────── */
  .receipt-card{ margin-top:20px; background:linear-gradient(180deg,#FBF7EE,#F1E9D8); color:#1a1714;
    border-radius:14px; padding:22px 22px 18px; font-family:var(--mono); position:relative;
    box-shadow:0 30px 50px -20px rgba(0,0,0,.6); animation:pop .5s cubic-bezier(.2,1.3,.4,1); }
  @keyframes pop{ 0%{ transform:scale(.93);} 100%{ transform:scale(1);} }
  .rc-head{ display:flex; justify-content:space-between; align-items:center; }
  .rc-kicker{ font-family:"Exo 2",sans-serif; font-weight:700; font-size:12px; letter-spacing:.02em; color:#3a342c; }
  .rc-tier{ font-family:"Exo 2",sans-serif; font-weight:800; font-size:12px; letter-spacing:.06em; text-transform:uppercase; }
  .rc-dotted{ border-top:1.5px dashed #b6ab97; margin:14px 0; }
  .rc-blessing{ font-family:"Exo 2",sans-serif; font-weight:600; font-size:14px; color:#5a5147; }
  .rc-amount{ display:flex; align-items:baseline; gap:10px; margin-top:6px; }
  .rc-num{ font-weight:700; font-size:46px; letter-spacing:-0.02em; color:#0E0E0E; line-height:1; }
  .rc-unit{ font-family:"Exo 2",sans-serif; font-weight:800; font-size:18px; color:var(--orange-deep); }
  .rc-to{ display:flex; flex-direction:column; gap:1px; margin-top:14px; font-size:12px; }
  .rc-to span{ color:#857a6b; }
  .rc-to strong{ font-family:"Exo 2",sans-serif; font-size:14px; color:#1a1714; }
  .rc-rows{ display:flex; flex-direction:column; gap:8px; }
  .rc-rows > div{ display:flex; justify-content:space-between; font-size:12px; color:#3a342c; }
  .rc-ok{ color:#1F8A3B; font-weight:600; }
  .rc-foot{ display:flex; align-items:center; justify-content:space-between; margin-top:18px; padding-top:14px; border-top:1.5px dashed #b6ab97; }
  .rc-foot .deepa-mark{ color:#1a1714; font-size:15px; }
  .rc-foot .dm-text{ color:#1a1714; }
  .rc-reset{ font-family:"Exo 2",sans-serif; font-size:11.5px; font-weight:600; color:#857a6b; background:none; border:none; cursor:pointer; }
  .rc-reset:hover{ color:var(--orange-deep); }
  .tier-jackpot .rc-num{ background:linear-gradient(120deg,var(--ember),var(--orange)); -webkit-background-clip:text; background-clip:text; color:transparent; }

  /* ── spark burst ────────────────────────────────────── */
  .spark-burst{ position:absolute; top:120px; left:50%; width:0; height:0; z-index:5; pointer-events:none; }
  .spark{ position:absolute; border-radius:50%; opacity:0; animation:fly .9s ease-out forwards; }
  @keyframes fly{ 0%{ transform:translate(0,0) scale(1); opacity:1;} 100%{ transform:translate(var(--tx),var(--ty)) scale(0); opacity:0;} }

  /* ── luck section ───────────────────────────────────── */
  .luck{ position:relative; z-index:2; margin-top:40px; padding:48px 44px; border:1px solid var(--line-2); border-radius:24px;
    background:linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0.01)); }
  .luck-head h2{ font-size:30px; font-weight:800; letter-spacing:-0.02em; }
  .luck-head p{ margin-top:10px; max-width:560px; font-size:15px; line-height:1.5; color:var(--muted); }
  .luck-bars{ display:grid; grid-template-columns:repeat(4,1fr); gap:26px; margin-top:34px; }
  .lb-top{ display:flex; justify-content:space-between; align-items:baseline; }
  .lb-tier{ font-weight:800; font-size:15px; }
  .lb-pct{ font-family:var(--mono); font-size:14px; color:var(--text); }
  .lb-track{ height:8px; border-radius:6px; background:rgba(255,255,255,0.07); margin-top:10px; overflow:hidden; }
  .lb-fill{ height:100%; border-radius:6px; box-shadow:0 0 16px -2px currentColor; }
  .lb-range{ font-family:var(--mono); font-size:12px; color:var(--muted); margin-top:10px; }

  /* ── footer ─────────────────────────────────────────── */
  .foot{ position:relative; z-index:2; display:flex; align-items:center; justify-content:space-between; gap:20px;
    margin-top:40px; padding:30px 0 44px; border-top:1px solid var(--line-2); }
  .foot-tag{ font-size:13px; color:var(--muted-2); text-align:right; }

  /* ── responsive ─────────────────────────────────────── */
  @media (max-width: 900px){
    .hero{ grid-template-columns:1fr; gap:36px; padding-top:24px; min-height:0; }
    .hero-claim{ order:-1; }
    .luck-bars{ grid-template-columns:1fr 1fr; gap:22px; }
    .amb{ display:none; }
    .a1,.a2{ display:none; }
  }
  @media (max-width: 560px){
    .page{ padding:0 18px; }
    .nav-event{ display:none; }
    .hero-meta{ gap:14px; flex-wrap:wrap; }
    .luck{ padding:32px 22px; }
    .luck-bars{ grid-template-columns:1fr; }
    .foot{ flex-direction:column; align-items:flex-start; }
    .foot-tag{ text-align:left; }
  }
</style>
</head>
<body data-bg="lanterns">
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="components.jsx"></script>
<script type="text/babel" src="app.jsx"></script>
</body>
